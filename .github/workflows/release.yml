name: release files

# One file per system, built on GitHub's machines from the tag of a published
# release and attached to it. The build is public: the log of every run is on
# the Actions tab, and each file carries a provenance attestation that ties it
# to this workflow and the exact commit (gh attestation verify <file>
# --owner stop-loss-enjoyer). PyInstaller is a build tool of this workflow
# only; the source runs without it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag of an existing release to build the files for
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows.exe
          - os: macos-latest
            suffix: macos-arm64
          # the Macs with an Intel processor, which the arm64 file does not run on
          - os: macos-15-intel
            suffix: macos-x86_64
          # the oldest Ubuntu GitHub still runs: a file packed on a newer one
          # asks for a newer glibc and does not start on Ubuntu 22.04
          - os: ubuntu-22.04
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: the tests, on the Python that goes into the file
        run: python -m unittest discover -s tests
      # tzdata goes into the file and not into the source: the clocks of the
      # prop firms have names Python on Windows cannot read without it
      - run: python -m pip install pyinstaller==6.22.3 tzdata==2026.4
      - name: one file
        run: python -m PyInstaller --onefile --clean --name Plainbook --paths . --hidden-import tzdata --collect-data tzdata tools/app_entry.py
      - name: name it after the release
        shell: bash
        run: |
          OUT="Plainbook-${TAG#v}-${{ matrix.suffix }}"
          if [ -f dist/Plainbook.exe ]; then mv dist/Plainbook.exe "$OUT"; else mv dist/Plainbook "$OUT"; fi
          chmod +x "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: the file starts and serves the front page
        shell: bash
        run: |
          PLAINBOOK_OPEN=0 PLAINBOOK_ROOT="$RUNNER_TEMP/pb" PLAINBOOK_PORT=8899 "./$OUT" &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/ > page.html && break
            sleep 1
          done
          grep -q "Plainbook" page.html
          grep -q "${TAG#v}" page.html
          kill %1
      - name: the macOS file keeps its permission inside a zip
        if: runner.os == 'macOS'
        run: |
          zip "$OUT.zip" "$OUT"
          echo "OUT=$OUT.zip" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.OUT }}
      - name: attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$OUT" --clobber

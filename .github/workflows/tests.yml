name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # no dependencies to install: the standard library is the whole of it
      - run: python -m unittest discover -s tests
      - name: no private records in the repository
        run: python tools/check_public.py

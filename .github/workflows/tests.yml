name: tests

on:
  push:
  pull_request:
  workflow_dispatch:      # so anyone can run the suite by hand

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # no dependencies to install: the standard library is the whole of it
      - run: python -m unittest discover -s tests
      - name: no private records in the repository
        run: python tools/check_public.py

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:      # so anyone can run the suite by hand

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # no dependencies to install: the standard library is the whole of it
      - run: python -m unittest discover -s tests
      - name: no private records in the repository
        run: python tools/check_public.py

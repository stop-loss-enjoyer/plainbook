# The package: `pipx install git+https://github.com/stop-loss-enjoyer/plainbook`
# gives the `plainbook` command. Nothing here is needed to run the program from
# its source; python3 -m plainbook.server works without any of it.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plainbook-journal"
dynamic = ["version"]
description = "A free trading journal that lives on your machine, for forex, futures, stocks, crypto and prop firm traders: plain markdown files, R-multiple statistics, MFE and MAE, prop firm rules, playbooks and reports. No cloud, no account, no dependencies. Windows, macOS, Linux."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["trading", "trading-journal", "trade-journal", "journal", "forex", "futures", "stocks", "crypto", "prop-firm", "ftmo", "r-multiple", "mfe", "mae", "trading-statistics", "markdown", "plain-text", "local-first"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/stop-loss-enjoyer/plainbook"
Changelog = "https://github.com/stop-loss-enjoyer/plainbook/blob/main/CHANGELOG.md"
Guide = "https://github.com/stop-loss-enjoyer/plainbook/blob/main/GUIDE.md"

[project.scripts]
plainbook = "plainbook.server:app"

[tool.setuptools]
packages = ["plainbook"]

[tool.setuptools.dynamic]
version = {attr = "plainbook.__version__"}
